    <circle r="78" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <g fill="url(#gold)">
      <rect x="-34" y="-34" width="68" height="68"/>
      <rect x="-34" y="-34" width="68" height="68" transform="rotate(45)"/>
    </g>
  </g>
  <!-- open book -->
