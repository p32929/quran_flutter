    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f8e3a3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f8e3a3" stop-opacity="0"/>
