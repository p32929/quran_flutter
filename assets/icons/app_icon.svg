      <stop offset="0" stop-color="#1d5a52"/>
      <stop offset="0.55" stop-color="#0f3b3a"/>
      <stop offset="1" stop-color="#08201f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e3a3"/>
