name: Tests

# Runs the host-side config test + the per-platform integration tests on every
# supported platform. Integration test files are run one-at-a-time because
# desktop devices get flaky when several app launch/teardown cycles are packed
# into a single `flutter test` invocation.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.1"
  FLUTTER_CHANNEL: "stable"
  # E2E test files, run individually (each launches the real app). The audio
  # E2E self-skips where just_audio has no backend (Windows/Linux).
  IT_FILES: "e2e_boot_read_test e2e_bookmark_test e2e_audio_test e2e_translation_download_test"

jobs:
  # ------------------------------------------------- Host-side unit/config test
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Run host tests (network config, etc.)
        run: flutter test test/

  # ---------------------------------------------------------------- macOS + iOS
  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Boot iOS simulator
        if: matrix.target == 'ios'
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}')
          echo "Booting $UDID"
          xcrun simctl boot "$UDID" || true
          echo "DEVICE_ID=$UDID" >> "$GITHUB_ENV"
      - name: Set macOS device
        if: matrix.target == 'macos'
        run: echo "DEVICE_ID=macos" >> "$GITHUB_ENV"
      - name: Run integration tests (${{ matrix.target }})
        run: |
          for f in $IT_FILES; do
            echo "::group::$f"
            flutter test integration_test/$f.dart -d "$DEVICE_ID" || exit 1
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            for f in $IT_FILES; do
              echo "::group::$f"
              flutter test integration_test/$f.dart -d emulator-5554 || exit 1
              echo "::endgroup::"
            done

  # ---------------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config xvfb xdg-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Run integration tests (Linux, under xvfb)
        run: |
          xvfb-run -a bash -c '
            for f in $IT_FILES; do
              echo "::group::$f"
              flutter test integration_test/$f.dart -d linux || exit 1
              echo "::endgroup::"
            done
          '

  # -------------------------------------------------------------------- Windows
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - name: Run integration tests (Windows)
        shell: pwsh
        run: |
          foreach ($f in $env:IT_FILES.Split(" ")) {
            Write-Host "::group::$f"
            flutter test integration_test/$f.dart -d windows
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "::endgroup::"
          }

  # ------------------------------------------------------------------------ Web
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - uses: nanasess/setup-chromedriver@v2
      - name: Run integration tests (Web / Chrome)
        run: |
          export DISPLAY=:99
          chromedriver --port=4444 &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sleep 3
          for f in $IT_FILES; do
            echo "::group::$f"
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/$f.dart \
              -d web-server --browser-name chrome --release || exit 1
            echo "::endgroup::"
          done
